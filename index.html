<style>
/* Layout concept: a quiet indigo study desk. Large mincho kana as the focal type, a single vermilion hanko stamp for the streak, everything else flat and ruled. */
:root {
  --bg: #F1F4F9; --surface: #FFFFFF; --surface2: #E6EBF4; --ink: #121A30; --muted: #58627A; --line: #D2D9E6;

  --f-body: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', 'Noto Sans JP', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1324; --surface: #151D33; --surface2: #1D2744; --ink: #E6EBF6; --muted: #9AA5BF; --line: #2A3556;
    --accent: #8CA5F2; --on-accent: #0D1324; --accent-soft: #222E52; --stamp: #EE7A62;
    --good: #5FC79B; --good-soft: #163B2E; --bad: #F28585; --bad-soft: #40222A; --warn: #E3B45F; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1324; --surface: #151D33; --surface2: #1D2744; --ink: #E6EBF6; --muted: #9AA5BF; --line: #2A3556;
  --accent: #8CA5F2; --on-accent: #0D1324; --accent-soft: #222E52; --stamp: #EE7A62;
  --good: #5FC79B; --good-soft: #163B2E; --bad: #F28585; --bad-soft: #40222A; --warn: #E3B45F; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }

  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0;

}

}

.nav { display: flex; gap: 2px; }

    justify-content: space-around; padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
  }

/* controls */

.actions.end { justify-content: center; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
.card.empty { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.grid { display: grid; gap: 12px; }
.grid.plan { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }

.tile b.jp-h { font-size: 26px; }
.chip { font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
.chip.on { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.lvtag { display: inline-block; font: 700 13px var(--f-display); color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 2px 8px; }

.step { display: flex; flex-direction: column; gap: 10px; }

.callout { display: flex; gap: 14px; justify-content: space-between; align-items: center; flex-wrap: wrap; border-color: var(--stamp); }

/* learn */

a.row:hover { border-color: var(--accent); }

.kgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 8px; }
.k { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; }
.k:hover { border-color: var(--accent); }
.kc { font: 700 32px/1.1 var(--f-display); }

.pips { display: inline-flex; gap: 3px; align-items: center; }

.item { display: flex; gap: 14px; align-items: center; padding: 12px 14px; }

.im .rd { font-size: 15px; }

.ro { color: var(--muted); font-size: 13px; }

.ex { margin-top: 10px; padding: 12px 14px; background: var(--surface2); border-radius: 8px; display: flex; flex-direction: column; gap: 2px; }
.exjp { font: 700 19px/1.4 var(--f-display); }
.exkana { font-size: 13.5px; color: var(--muted); }

.topline { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; }
.fc { min-height: 300px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 12px; padding: 28px 22px; cursor: pointer; }

.fc-rd { font: 500 24px var(--f-display); }

.grades { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.grades .btn { min-width: 120px; }
.done-card { display: flex; flex-direction: column; gap: 14px; }
.done-card h1 { font-size: 44px; color: var(--accent); }

/* test */
.lobby { display: flex; flex-direction: column; gap: 18px; }
.row2 { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; }
.facts { margin: 0; padding-left: 18px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 220px; }
.qcard { display: flex; flex-direction: column; gap: 10px; align-items: center; text-align: center; padding: 26px 18px; }
.prompt { font: 700 26px/1.35 var(--f-body); overflow-wrap: anywhere; }

.fb { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 12px 14px; border-radius: 10px; border: 1px solid; }

.legend { margin-top: 10px; }
.scroll { overflow-x: auto; padding: 4px 14px; }
.tbl { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; min-width: 420px; }

}

.sp{display:block;font-size:12.5px;font-weight:700;color:var(--accent);margin-bottom:2px}

<script>
'use strict';
/* ================= DATA ================= */
const LEVELS = [
  { id: 'kana', name: 'Foundations', tag: 'かな', blurb: 'Hiragana and katakana: every sound you will read and write.' },

function kanaItems(rows, kata) {
  const out = [];
  rows.forEach(r => {
    const rs = r[1].split(' ');
    [...r[0]].forEach((c, i) => out.push({ jp: kata ? toKata(c) : c, rd: '', en: '', ro: rs[i], sc: kata ? 'k' : 'h' }));
  });

}
function yoonItems(kata) {
  return YOON.split(' ').map(p => {

}

/* romaji converter (hepburn-ish) */
const RO = {}; H_ROWS.concat(H_DAK).forEach(r => { const rs = r[1].split(' '); [...r[0]].forEach((c, i) => { RO[c] = rs[i].replace(/\(.*\)/, ''); }); });
RO['を'] = 'o';
const ROY = {}; YOON.split(' ').forEach(p => { const a = p.split(':'); ROY[a[0]] = a[1]; });
function toRomaji(str) {
  const s = toHira(str || ''); let out = ''; let dbl = false;
  for (let i = 0; i < s.length; i++) {
    const c = s[i]; let r;
    if (c === 'っ') { dbl = true; continue; }
    const two = s.slice(i, i + 2);
    if (ROY[two]) { r = ROY[two]; i++; }
    else if (RO[c]) r = RO[c];
    else if (c === 'ー') { const v = out.slice(-1); r = /[aiueo]/.test(v) ? v : ''; }
    else r = c;
    if (dbl && /^[a-z]/.test(r)) r = (r.indexOf('ch') === 0 ? 't' : r[0]) + r;
    dbl = false; out += r;
  }
  return out;
}
function sentenceRomaji(kana) {
  if (!kana) return '';
  const t = kana.split(' ').map(w => w === 'は' ? 'wa' : w === 'へ' ? 'e' : toRomaji(w)).join(' ');
  return (t.charAt(0).toUpperCase() + t.slice(1)).replace(/。/g, '.').replace(/、/g, ',');
}

/* ================= HELPERS ================= */
const pad2 = n => String(n).padStart(2, '0');
const dkey = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const todayKey = () => dkey(new Date());
const parseKey = k => { const a = k.split('-').map(Number); return new Date(a[0], a[1] - 1, a[2]); };
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return dkey(d); };
const daysBetween = (a, b) => Math.round((parseKey(b) - parseKey(a)) / 86400000);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const hashStr = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
const rnd = seed => { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };
function shuffle(arr, r) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

function dayRec(k) { return S.days[k] || (S.days[k] = { xp: 0, rev: 0, nw: 0, tests: 0 }); }

const pctOf = t => Math.round(t.c / t.n * 100);

const GRADE_MSG = { S: 'Outstanding. That is native-level accuracy.', A: 'Very strong. A few details left to polish.', B: 'Solid. Review the misses and you will climb.', C: 'Getting there. Short daily reviews will lift this fast.', D: 'A hard day. Drill the misses once and try again tomorrow.' };

/* ================= QUESTIONS ================= */
function pickDistractors(pool, it, keyFn, r, k) {
  const ans = keyFn(it); const seen = new Set([ans]); const out = [];
  const cand = shuffle(pool.filter(x => x !== it), r);
  cand.sort((a, b) => ((a.u === it.u ? 0 : a.lv === it.lv ? 1 : 2) - (b.u === it.u ? 0 : b.lv === it.lv ? 1 : 2)));
  for (const x of cand) { const v = keyFn(x); if (v && !seen.has(v)) { seen.add(v); out.push(v); if (out.length >= k) break; } }
  return out;
}
function mkQ(it, prompt, sub, correct, wrong, r, extra) {
  const choices = shuffle([correct].concat(wrong), r);
  return Object.assign({ id: it.id, cat: it.cat, prompt, sub, choices, ans: choices.indexOf(correct), explain: explainItem(it), say: it.t === 'grammar' ? (it.ex.jp) : (it.rd || it.jp) }, extra || {});
}
function explainItem(it) {
  if (it.t === 'kana') return it.jp + ' is read “' + it.ro + '”.';
  if (it.t === 'grammar') return it.jp + ' · ' + it.en + '. ' + it.note;
  const rd = it.rd && it.rd !== it.jp ? '（' + it.rd + '）' : '';
  return it.jp + rd + ' · ' + it.en;
}
function makeQ(it, r) {
  if (it.t === 'kana') {
    const pool = ITEMS.filter(x => x.t === 'kana' && x.sc === it.sc);
    if (r() < 0.5) return mkQ(it, it.jp, 'Which sound is this?', it.ro, pickDistractors(pool, it, x => x.ro, r, 3), r, { big: true, say: it.jp });
    return mkQ(it, it.ro, 'Which character is this?', it.jp, pickDistractors(pool, it, x => x.jp, r, 3), r, { say: it.jp });
  }
  if (it.t === 'grammar') {
    const q = it.quiz;
    return mkQ(it, q.q, it.ex.en, q.a, q.w.slice(0, 3), r, { big: false, sentence: true });
  }
  const pool = ITEMS.filter(x => x.t === it.t);
  const kinds = ['jp2en', 'en2jp'];
  if (it.rd && it.rd !== it.jp) kinds.push('rd');
  const kind = kinds[Math.floor(r() * kinds.length)];
  if (kind === 'jp2en') return mkQ(it, it.jp, 'What does this mean?', it.en, pickDistractors(pool, it, x => x.en, r, 3), r, { big: true });
  if (kind === 'en2jp') return mkQ(it, it.en, 'Which one is this?', it.jp, pickDistractors(pool, it, x => x.jp, r, 3), r, {});
  return mkQ(it, it.jp, 'How is this read?', it.rd, pickDistractors(pool, it, x => x.rd, r, 3), r, { big: true });
}
function buildQuestions(lvId, n, seed) {
  const r = rnd(seed); const li = LEVEL_IDX[lvId];
  const prim = ITEMS.filter(i => i.lv === lvId);
  const sec = ITEMS.filter(i => LEVEL_IDX[i.lv] < li && (i.t !== 'kana' || li <= 1));
  const nPrim = Math.min(prim.length, Math.round(n * (sec.length ? 0.65 : 1)));
  let all = shuffle(prim, r).slice(0, nPrim);
  all = all.concat(shuffle(sec, r).slice(0, n - all.length));
  if (all.length < n) all = all.concat(shuffle(prim.filter(x => all.indexOf(x) < 0), r).slice(0, n - all.length));
  return shuffle(all, r).map(it => makeQ(it, r));
}
function questionsFor(items, n, seed) {
  const r = rnd(seed);
  return shuffle(items, r).slice(0, n).map(it => makeQ(it, r));
}

/* ================= SESSIONS ================= */
function startCards(key, ids, title, back) {
  X.cards = { key, queue: ids.slice(), i: 0, flip: false, res: { again: 0, good: 0, easy: 0 }, title, back, xp0: S.xp };
}
function gradeCard(g) {
  const s = X.cards; if (!s || s.i >= s.queue.length) return;
  const id = s.queue[s.i]; const cur = S.it[id]; const t = todayKey(); const first = !cur;
  let nb;
  if (g === 'again') nb = 0;
  else if (g === 'good') nb = first ? 1 : Math.min(5, cur[0] + 1);
  else nb = first ? 2 : Math.min(5, cur[0] + 2);
  S.it[id] = [nb, addDays(t, INT[nb]), (cur ? cur[2] : 0) + (g === 'again' ? 0 : 1), (cur ? cur[3] : 0) + (g === 'again' ? 1 : 0)];
  const d = dayRec(t); d.rev++; if (first) d.nw++;
  addXp(g === 'again' ? 1 : g === 'good' ? 2 : 3);
  s.res[g]++;
  if (g === 'again' && s.queue.length < 60) s.queue.push(id);
  s.i++; s.flip = false;
  touch();
}
function startTest(o) {
  const t = todayKey();
  const daily = o.record ? !S.tests.some(x => x.d === t && x.dy) : false;
  const seed = o.seed != null ? o.seed : hashStr(t + '|' + o.lv + '|' + (o.record ? (daily ? 'd' : 'p' + testsOn(t).length) : o.key));
  const qs = o.items ? questionsFor(o.items, o.n, seed) : buildQuestions(o.lv, o.n, daily ? hashStr(t + '|' + o.lv) : seed);
  X.test = { key: o.key || 'test', kind: o.record ? 'daily' : 'drill', record: !!o.record, daily, lv: o.lv, title: o.title, back: o.back || '#test', qs, i: 0, picked: null, correct: 0, cat: {}, log: [], t0: Date.now(), done: false };
}
function answerQ(idx) {
  const T = X.test; if (!T || T.done || T.picked != null) return;
  const q = T.qs[T.i]; T.picked = idx; const ok = idx === q.ans;
  if (ok) T.correct++;
  const c = T.cat[q.cat] || (T.cat[q.cat] = [0, 0]); c[1]++; if (ok) c[0]++;
  T.log.push({ id: q.id, ok });
  const cur = S.it[q.id]; const t = todayKey();
  if (ok) S.it[q.id] = cur ? [cur[0], cur[1], cur[2] + 1, cur[3]] : [1, addDays(t, 1), 1, 0];
  else S.it[q.id] = cur ? [Math.max(0, cur[0] - 1), t, cur[2], cur[3] + 1] : [0, t, 0, 1];
  touch();
}
function nextQ() {
  const T = X.test; if (!T || T.picked == null) return;
  if (T.i + 1 >= T.qs.length) { finishTest(); return; }
  T.i++; T.picked = null;
}
function finishTest() {
  const T = X.test; if (T.done) return;
  T.done = true; T.secs = Math.round((Date.now() - T.t0) / 1000);
  const n = T.qs.length, c = T.correct, pct = Math.round(c / n * 100);
  let xp = T.record ? (T.daily ? c * 10 + 20 + (pct >= 90 ? 30 : 0) : c * 3) : c * 2;
  T.xp = xp; T.pct = pct;
  X.miss = T.log.filter(l => !l.ok).map(l => l.id);
  if (T.record) {
    S.tests.push({ t: Date.now(), d: todayKey(), lv: T.lv, n, c, s: T.secs, dy: T.daily ? 1 : 0, cat: T.cat });
    if (S.tests.length > 150) S.tests = S.tests.slice(-150);
    dayRec(todayKey()).tests++;
  } else dayRec(todayKey()).rev += 0;
  addXp(xp);
  touch();
}

/* ---------- Scores ---------- */
function chart14() {
  const W = 640, H = 230, L = 34, R = 8, Tp = 18, B = 30; const ph = H - Tp - B; const t = todayKey();
  const keys = []; for (let i = 13; i >= 0; i--) keys.push(addDays(t, -i));
  const bw = (W - L - R) / 14; let g = ''; let any = false;
  [0, 50, 100].forEach(v => { const y = Tp + ph * (1 - v / 100); g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '" class="gl"/><text x="' + (L - 6) + '" y="' + (y + 4) + '" class="gt" text-anchor="end">' + v + '</text>'; });
  keys.forEach((k, i) => {
    const sc = dailyScore(k); const x = L + i * bw + bw * 0.18; const w = bw * 0.64; const d = parseKey(k);
    const lab = (i === 13 || d.getDate() === 1 || i % 2 === 0) ? d.getDate() : '';
    g += '<text x="' + (x + w / 2) + '" y="' + (H - 10) + '" class="gt' + (k === t ? ' today' : '') + '" text-anchor="middle">' + lab + '</text>';
    if (sc != null) { any = true; const h = Math.max(2, ph * sc / 100); g += '<rect x="' + x + '" y="' + (Tp + ph - h) + '" width="' + w + '" height="' + h + '" rx="3" class="bf' + (k === t ? ' today' : '') + '"/><text x="' + (x + w / 2) + '" y="' + (Tp + ph - h - 5) + '" class="gv" text-anchor="middle">' + sc + '</text>'; }
    else g += '<rect x="' + x + '" y="' + (Tp + ph - 2) + '" width="' + w + '" height="2" class="be"/>';
  });
  if (!any) g += '<text x="' + (W / 2) + '" y="' + (Tp + ph / 2) + '" class="gt" text-anchor="middle">Your daily test scores will appear here.</text>';
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Daily test score for the last 14 days">' + g + '</svg>';
}
function heatmap() {

    h += '<i class="hm l' + lv + '" title="' + k + ': ' + x + ' XP"></i>';

}

/* ---------- Progress ---------- */
function windowStats(from, to) {
  const ts = S.tests.filter(x => x.d >= from && x.d <= to); let xp = 0, nw = 0, days = 0;
  for (let k = from; k <= to; k = addDays(k, 1)) { const d = S.days[k]; if (d) { xp += d.xp; nw += d.nw; if (dayActive(k)) days++; } }
  const avg = ts.length ? Math.round(ts.reduce((a, x) => a + pctOf(x), 0) / ts.length) : null;
  return { ts: ts.length, avg, xp, nw, days };
}

  ['私の町', 'My town', 'N4 · Describing a place', `
私の町は小さいですが、とても静かです。|わたし の まち は ちいさい ですが、とても しずか です。|My town is small but very quiet.
駅の近くに大きい公園があります。|えき の ちかく に おおきい こうえん が あります。|There is a big park near the station.
春には、桜がきれいに咲きます。|はる には、さくら が きれい に さきます。|In spring the cherry blossoms bloom beautifully.
私はこの町が好きなので、ずっと住みたいです。|わたし は この まち が すき なので、ずっと すみたい です。|I like this town, so I want to live here for good.`]
];
const L_SENT = [
  ['Survival phrases', `
分かりません。|わかりません。|I do not understand.
もう一度お願いします。|もう いちど おねがいします。|One more time, please.
ゆっくり話してください。|ゆっくり はなして ください。|Please speak slowly.
英語が話せますか。|えいご が はなせます か。|Can you speak English?
トイレはどこですか。|トイレ は どこ ですか。|Where is the restroom?
助けてください。|たすけて ください。|Please help me.

日本語で何と言いますか。|にほんご で なん と いいます か。|How do you say it in Japanese?`],
  ['Travel', `
切符を一枚ください。|きっぷ を いちまい ください。|One ticket, please.
この電車は京都に止まりますか。|この でんしゃ は きょうと に とまります か。|Does this train stop at Kyoto?
ホテルを予約しました。|ホテル を よやく しました。|I have booked a hotel.
パスポートを見せてください。|パスポート を みせて ください。|Please show your passport.
写真を撮ってもいいですか。|しゃしん を とっても いい ですか。|May I take a photo?
空港までどのぐらいかかりますか。|くうこう まで どの ぐらい かかります か。|How long does it take to the airport?`],
  ['Feelings and opinions', `
とても嬉しいです。|とても うれしい です。|I am very happy.
少し疲れました。|すこし つかれました。|I got a little tired.
日本の文化に興味があります。|にほん の ぶんか に きょうみ が あります。|I am interested in Japanese culture.

  ['Daily life', `
今日はいい天気ですね。|きょう は いい てんき です ね。|Nice weather today, isn’t it?
一緒に昼ご飯を食べませんか。|いっしょ に ひるごはん を たべません か。|Shall we eat lunch together?

const exb = (jp, kana, en, sp) => '<div class="ex">' + (sp ? '<span class="sp">' + esc(sp) + '</span>' : '') + '<div class="exjp">' + esc(jp) + ' ' + spk(jp) + '</div><div class="exkana">' + esc(kana) + '</div><div class="exro">' + esc(sentenceRomaji(kana)) + '</div><div class="exen">' + esc(en) + '</div></div>';
function viewLibrary() {
  return '<h1 class="h"><span class="jp-h">読む</span> Library</h1><p class="sub">Read and listen to real Japanese. Every line shows kanji, kana, romaji and English. Tap the speaker to hear it.</p><div class="grid lv">' +
    LIBS.map(l => '<a class="card lvcard" href="#lib-' + l[0] + '"><span class="lvtag">' + l[1] + '</span><h3>' + l[2] + '</h3><p>' + esc(l[3]) + '</p></a>').join('') + '</div>';
}
function viewLib(k) {
  const m = LIBS.find(l => l[0] === k); if (!m) return viewNotFound(); let b = '';
  if (k === 'kana') {
    b = L_KANA.map(g => { const a = g[1].split('|'); let h = '<h2 class="sec">' + g[0] + '</h2><div class="kgrid">'; for (let i = 0; i < a.length; i += 2) h += '<button type="button" class="k" data-a="say" data-v="' + esc(a[i]) + '"><span class="kc">' + a[i] + '</span><span class="kr">' + esc(a[i + 1]) + '</span></button>'; return h + '</div>'; }).join('') +
      '<h2 class="sec">Spelling rules</h2><div class="card"><ul>' + L_NOTES.map(n => '<li>' + esc(n) + '</li>').join('') + '</ul></div>' +
      '<div class="actions"><a class="btn" href="#unit-kana-h1">Hiragana</a><a class="btn ghost" href="#unit-kana-k1">Katakana</a></div>';
  } else if (k === 'talk') {
    b = L_TALK.map(d => '<article class="card"><h3>' + d[0] + ' · ' + esc(d[1]) + '</h3><p class="meta">' + esc(d[2]) + '</p>' + T(d[3]).map(r => exb(r[1], r[2], r[3], r[0])).join('') + '</article>').join('');
  } else if (k === 'read') {
    b = L_READ.map(d => { const r = T(d[3]); return '<article class="card"><h3>' + d[0] + ' · ' + esc(d[1]) + '</h3><p class="meta">' + esc(d[2]) + ' ' + spk(r.map(x => x[0]).join('')) + '</p>' + r.map(x => exb(x[0], x[1], x[2])).join('') + '</article>'; }).join('');
  } else {
    b = L_SENT.map(g => '<article class="card"><h3>' + g[0] + '</h3>' + T(g[1]).map(r => exb(r[0], r[1], r[2])).join('') + '</article>').join('');
  }
  return '<a class="back" href="#library">Library</a><h1 class="h"><span class="jp-h">' + m[1] + '</span> ' + m[2] + '</h1><p class="sub">' + esc(m[3]) + '</p><div class="list">' + b + '</div>';
}

/* ---------- Router ---------- */
let lastH = null;
function ensureCards(h, k) {
  if (X.cards && X.cards.key === h) return;
  let ids = [], title = 'Study', back = '#learn';
  if (k === 'due') { ids = dueIds().slice(0, 30); title = 'Review'; back = '#today'; }
  else if (k === 'new') { ids = newIds(5); title = 'New items'; back = '#today'; }
  else if (k === 'weak') { ids = weakIds(); title = 'Weak spots'; back = '#progress'; }
  else if (k === 'miss') { ids = X.miss.slice(); title = 'Mistakes'; back = '#test'; }
  else if (UNIT_BY_ID[k]) { ids = UNIT_BY_ID[k].items.map(i => i.id); title = UNIT_BY_ID[k].title; back = '#unit-' + k; }
  startCards(h, ids, title, back);
}
function ensureDrill(h, k) {
  if (X.test && X.test.key === h) return;
  const u = UNIT_BY_ID[k]; if (!u) { X.test = null; return; }
  startTest({ record: false, lv: u.lv, items: u.items, n: 10, title: 'Quick quiz · ' + u.title, key: h, back: '#unit-' + k });
}
function render() {
  const h = (location.hash || '#today').slice(1) || 'today'; let html = '';
  if (h.indexOf('cards-') === 0) ensureCards(h, h.slice(6)); else X.cards = null;
  if (h.indexOf('drill-') === 0) ensureDrill(h, h.slice(6)); else if (X.test && X.test.kind === 'drill') X.test = null;
  if (h === 'today') html = viewToday();
  else if (h === 'learn') html = viewLearn();
  else if (h.indexOf('level-') === 0) html = viewLevel(h.slice(6));
  else if (h.indexOf('unit-') === 0) html = viewUnit(h.slice(5));
  else if (h.indexOf('cards-') === 0) html = viewCards();
  else if (h.indexOf('drill-') === 0) html = X.test ? (X.test.done ? viewResult(X.test) : viewQuestion(X.test)) : viewNotFound();
  else if (h === 'library') html = viewLibrary();
  else if (h.indexOf('lib-') === 0) html = viewLib(h.slice(4));
  else if (h === 'test') html = viewTest();
  else if (h === 'scores') html = viewScores();
  else if (h === 'progress') html = viewProgress();
  else html = viewNotFound();
  const sect = h === 'today' ? 'today' : (h === 'test') ? 'test' : h === 'scores' ? 'scores' : h === 'progress' ? 'progress' : /^lib/.test(h) ? 'library' : 'learn';
  document.querySelectorAll('#nav a').forEach(a => { if (a.dataset.n === sect) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  $app.innerHTML = html + '<p class="foot">' + (X.status === 'account' ? 'Saved to your account.' : 'Saved on this device.') + '</p>';
  const chip = document.getElementById('hdr-streak'); if (chip) chip.textContent = streak() + ' day' + (streak() === 1 ? '' : 's');
  const xpc = document.getElementById('hdr-xp'); if (xpc) xpc.textContent = S.xp + ' XP';
  if (h !== lastH) { window.scrollTo(0, 0); lastH = h; }
}
onStatus = () => render();

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a, v = el.dataset.v;
  if (a === 'say') { speak(v); return; }
  if (a === 'flip') { if (X.cards) X.cards.flip = true; }
  else if (a === 'grade') gradeCard(v);
  else if (a === 'pick') answerQ(+v);
  else if (a === 'next') nextQ();
  else if (a === 'start') startTest({ record: true, lv: X.testLv || S.pref.lv, n: 20, title: 'Mock test · ' + LEVEL_BY_ID[X.testLv || S.pref.lv].tag, key: 'test' });
  else if (a === 'again-test') { X.test = null; location.hash = '#test'; }
  else if (a === 'abandon') { const back = X.test && X.test.back; X.test = null; if (back && back !== '#test') location.hash = back; }
  else if (a === 'reset1') X.confirm = true;
  else if (a === 'reset0') X.confirm = false;
  else if (a === 'reset2') { S = blank(); X.cards = null; X.test = null; X.miss = []; X.confirm = false; touch(); }
  render();
});
document.addEventListener('change', e => {
  if (e.target.id === 'lvsel') { S.pref.lv = e.target.value; touch(); render(); }
  else if (e.target.id === 'tlsel') { X.testLv = e.target.value; render(); }
});
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.target.closest('select,input,textarea')) return;
  const h = (location.hash || '#today').slice(1); const body = e.target === document.body;
  const T = X.test;
  if (T && !T.done && (h === 'test' || h.indexOf('drill-') === 0)) {
    if (/^[1-4]$/.test(e.key) && T.picked == null && +e.key <= T.qs[T.i].choices.length) { answerQ(+e.key - 1); render(); }
    else if ((e.key === 'Enter' || e.key === ' ') && T.picked != null && body) { e.preventDefault(); nextQ(); render(); }
    return;
  }
  const s = X.cards;
  if (s && h.indexOf('cards-') === 0 && s.i < s.queue.length) {
    if ((e.key === ' ' || e.key === 'Enter') && !s.flip && body) { e.preventDefault(); s.flip = true; render(); }
    else if (s.flip && /^[1-3]$/.test(e.key)) { gradeCard(['again', 'good', 'easy'][+e.key - 1]); render(); }
  }
});
window.addEventListener('hashchange', render);

/* ---------- Boot ---------- */
(function boot() {
  const nav = document.getElementById('nav');
  nav.innerHTML = NAV.map(n => '<a href="#' + n[0] + '" data-n="' + n[0] + '"><span class="nj">' + n[1] + '</span><span class="ne">' + n[2] + '</span></a>').join('');
  loadLocal(); saveHook = scheduleSave;
  render();
  initStorage().then(render, render);
})();

</script>
